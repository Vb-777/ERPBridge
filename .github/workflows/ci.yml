name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_snowflake:
        description: "Also build on Snowflake (needs SNOWFLAKE_* secrets)"
        type: boolean
        default: false

env:
  DO_NOT_TRACK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: Lint SQL
        run: sqlfluff lint dbt/models
      - run: scripts/fetch_data.sh
      - name: Pipeline (day 1 + day 2) on DuckDB, with all dbt tests
        run: ./run_pipeline.sh data/adventureworks
      - name: End-to-end and unit tests
        run: ERPBRIDGE_SKIP_RUN=1 python -m pytest -q tests
      - name: Docs and lineage site
        run: cd dbt && dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            results/
            dashboard/erpbridge_dashboard.html
            dbt/target/manifest.json
            dbt/target/catalog.json
            dbt/target/index.html


  snowflake:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_snowflake
    needs: build
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: scripts/fetch_data.sh && python extract/aw_extract.py data/adventureworks landing/erp_a && python extract/make_erp_b.py landing
      - run: python load/load.py snowflake
      - run: cd dbt && dbt build --profiles-dir . --target snowflake
